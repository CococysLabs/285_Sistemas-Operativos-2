apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      containers:
        - name: monitor
          image: nginx
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
spec:
  type: ClusterIP
  selector:
    app: monitor
  ports:
    - port: 80
      targetPort: 80
